name: Build check (from private source)

# Manual only. Builds the private source with a read-only deploy key and runs the tests.
# Output is deliberately quiet: compiler and test output goes to a file, and only a pass/fail line,
# error messages without source lines, and failing test names are printed. No artifacts are uploaded.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the private source repo"
        required: true
        default: "4.1-creators"

permissions:
  contents: read

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
      - name: Get the source
        run: git clone -q --depth 1 --branch "${{ inputs.ref }}" git@github.com:Bands-yt/kronos-platform.git . 2>/dev/null
      - name: Install dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5 > /dev/null
          sudo apt-get install -y -qq -o Acquire::Retries=5 build-essential cmake ninja-build git pkg-config libvulkan-dev libsdl2-dev zlib1g-dev libcurl4-openssl-dev libsecret-1-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev glslc > /dev/null
      - name: Configure and build
        run: |
          set +e
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release > "$RUNNER_TEMP/build.log" 2>&1 \
            && cmake --build engine/build --parallel --target engine_runtime studio engine_tests kronos_compat >> "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "BUILD FAILED. $(grep -c 'error' "$RUNNER_TEMP/build.log") error lines (messages only):"
            grep -E 'error' "$RUNNER_TEMP/build.log" | sed -E 's|^[^ ]*/([^/ :]+):[0-9]+:[0-9]+:|\1:|' | cut -c1-200 | head -30
            exit 1
          fi
          echo "BUILD OK"
      - name: Tests
        working-directory: engine
        run: |
          set +e
          ./build/tests/engine_tests > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          grep -E '^FAIL|checks passed' "$RUNNER_TEMP/test.log" | cut -c1-200 | head -40
          exit $code
      - name: Roblox compatibility
        working-directory: engine
        run: ./build/src/kronos_compat 2>&1 | grep -E 'All places' | cut -c1-200

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
      - name: Get the source
        shell: bash
        run: git clone -q --depth 1 --branch "${{ inputs.ref }}" git@github.com:Bands-yt/kronos-platform.git . 2>/dev/null
      - name: Install dependencies
        run: vcpkg install "sdl2[vulkan]:x64-windows" zlib:x64-windows curl:x64-windows *> $null
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
      - name: Vulkan tools on PATH
        run: echo "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure and build
        run: |
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          cmake -S engine -B engine/build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release *> $log
          $ok = ($LASTEXITCODE -eq 0)
          if ($ok) { cmake --build engine/build --config Release --parallel --target engine_runtime studio engine_tests *>> $log; $ok = ($LASTEXITCODE -eq 0) }
          if (-not $ok) {
            $errs = Select-String -Path $log -Pattern 'error' | ForEach-Object { ($_.Line -replace '^.*[\\/]([^\\/(]+)\(\d+(,\d+)?\)', '$1') }
            "BUILD FAILED. $($errs.Count) error lines (messages only):"
            $errs | ForEach-Object { if ($_.Length -gt 200) { $_.Substring(0, 200) } else { $_ } } | Select-Object -First 30
            exit 1
          }
          "BUILD OK"
      - name: Tests
        working-directory: engine
        env:
          KRONOS_SCRIPT_BUDGET_MS: "200"
        run: |
          $log = Join-Path $env:RUNNER_TEMP "test.log"
          .\build\tests\Release\engine_tests.exe *> $log
          $code = $LASTEXITCODE
          Select-String -Path $log -Pattern '^FAIL|checks passed' | ForEach-Object { $_.Line } | Select-Object -First 40
          exit $code
